# Publish RADAR to PyPI when a GitHub release is published.
#
# One-time setup (no API token needed -- PyPI "trusted publishing"):
#   1. On pypi.org: Account settings -> Publishing -> Add a new pending publisher
#        PyPI project name : radar-raman
#        Owner             : bogdanoancea
#        Repository name   : RADAR
#        Workflow name     : publish.yml
#        Environment name  : pypi
#   2. On GitHub: Settings -> Environments -> New environment "pypi"
#      (optionally add yourself as a required reviewer).
#
# To release: set __version__ in src/radar_raman/_version.py, update CHANGELOG.md,
# push, then create a GitHub release with the tag v<version> (e.g. v0.1.0).

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/radar_raman/_version.py').read()).group(1))")
          echo "tag: $TAG   package version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match __version__ ($VERSION) in src/radar_raman/_version.py"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check that the pre-trained weights are in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -E "radar_raman/weights/(standard|ensemble)\.h5"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel and run the tests
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[test,formats]"
          rm -rf src            # test the installed wheel, not the source tree
          python -m pytest -m "not slow" -q

  publish:
    name: Upload to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/radar-raman/
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
